name: QNB standalone Windows x64

on:
  push:
    branches:
      - QNB-VB
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.resx'
      - '.github/workflows/qnb-standalone.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout QNB-VB
        uses: actions/checkout@v4
      - name: Install .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore dependencies
        run: dotnet restore QNB.csproj -r win-x64
      - name: Publish standalone executable
        run: dotnet publish QNB.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/QNB.exe')) { throw 'QNB.exe not generated' }
          Get-Item 'publish/QNB.exe' | Select-Object Name,Length
      - name: Upload QNB.exe
        uses: actions/upload-artifact@v4
        with:
          name: QNB-standalone-win-x64
          path: publish/QNB.exe
          if-no-files-found: error
